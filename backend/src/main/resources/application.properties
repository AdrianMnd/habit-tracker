spring.application.name=habit-tracker

# Base de datos (Neon Postgres) - se rellena via variables de entorno en Render
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/habit_tracker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Origen(es) permitidos por CORS - separados por coma si hay varios
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Gemini (chat de recomendacion de habitos)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-flash-latest}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta

server.port=${PORT:8080}

# JWT - la clave debe ser aleatoria y de al menos 32 caracteres (256 bits)
# para el algoritmo HS256. Nunca la subas al repositorio, va en .env.
jwt.secret=${JWT_SECRET:}
# 24 horas en milisegundos
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Solo exponemos /actuator/health (no toda la superficie de Actuator,
# que incluye cosas como /actuator/env con variables de entorno).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
