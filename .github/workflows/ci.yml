name: CI

# Corre en cada push a dev/master y en cada PR contra ellas - esto es lo
# que Render (una vez cambies su Auto-Deploy a "After CI checks pass")
# necesita ver en verde antes de desplegar: GitHub expone cada job de
# aqui debajo como un "check" sobre el commit, sin nada mas que
# configurar en este archivo para que eso funcione.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  backend-tests:
    name: Backend (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # cache: 'maven' memoriza ~/.m2/repository entre ejecuciones,
          # invalidandola solo cuando cambia pom.xml - evita volver a
          # descargar todo Spring Boot en cada run.
          cache: maven

      # Los tests actuales (HabitServiceTest, AuthServiceTest) son tests
      # unitarios puros con Mockito (@ExtendWith(MockitoExtension.class)),
      # sin @SpringBootTest ni contexto de Spring real - por eso este job
      # NO necesita una Postgres levantada, a diferencia del job de e2e
      # de mas abajo.
      - run: mvn -B test

  frontend-tests:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run test:unit
      # "npm run build" ejecuta "vue-tsc -b && vite build" (ver
      # package.json) - ademas de comprobar que el bundle de produccion
      # se genera sin errores, esto es lo que de verdad valida los tipos
      # de TypeScript en CI (Vitest, con transformacion via esbuild, no
      # comprueba tipos por si solo).
      - run: npm run build

  e2e-tests:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habit_tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar el backend
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Arrancar el backend en segundo plano
        working-directory: backend
        # JWT_SECRET aqui es un valor fijo SOLO para este job de CI - no
        # firma nada que salga de esta ejecucion ni se reutiliza en
        # produccion (esa vive como variable de entorno en Render). El
        # resto de valores (DATABASE_URL, etc.) ya caen en los defaults
        # de application.properties, que apuntan exactamente al servicio
        # "postgres" de arriba.
        run: |
          nohup java -jar target/habit-tracker-0.1.0.jar > backend.log 2>&1 &
          echo "Esperando a que el backend responda en /actuator/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend arriba."
              exit 0
            fi
            sleep 2
          done
          echo "El backend no respondio a tiempo - volcando logs:"
          cat backend.log
          exit 1
        env:
          JWT_SECRET: ci-only-secret-nunca-usado-en-produccion-1234567890

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # A diferencia del sandbox de desarrollo (que trae Chromium
      # pre-instalado), un runner de GitHub Actions parte de cero -
      # "--with-deps" instala tambien las librerias del sistema que
      # Chromium headless necesita para arrancar en un contenedor Linux
      # minimo (fuentes, libnss3, etc.), no solo el propio navegador.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      # playwright.config.ts arranca el frontend solo (webServer); con
      # CI=true (GitHub Actions lo define automaticamente), reuseExistingServer
      # se evalua a false, asi que siempre parte de un servidor limpio.
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: true

      - name: Subir el reporte de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
